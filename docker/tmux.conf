# --- Terminal & Colour ---
set -g default-terminal "screen-256color"

# --- Resize Panes (vim-style) ---
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z          # zoom current pane

# --- Window Navigation ---
bind C-p previous-window
bind C-n next-window

# --- Window Behaviour ---
set -g renumber-windows on
set -g set-clipboard on

# --- Mouse ---
# Enables: click to focus panes, click window tabs to switch,
#          drag pane borders to resize, scrollwheel to browse history.
set -g mouse on

# --- Scrollback ---
# 2026-10-01: `history-limit 100000` on nine chatty ROS panes grew the tmux
# server to a ~289 MB heap, and the segfault that killed the recording stack was
# a bulk SIMD copy. 2000 lines per pane is tmux's own default and still covers
# far more than the console needs - full ROS logs go to the files under
# <session>/, not to scrollback.
set -g history-limit 2000

