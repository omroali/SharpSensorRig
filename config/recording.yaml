# Unified recording settings — read by all sensor
# Kinect, RealSense, Veloyne, Vicon
# recording managers. Each manager only uses the keys relevant to it.
#
# This file lives in the repo-level config/ directory, mounted into the
# container at $SENSOR_CONFIG_DIR (/home/ubuntu/config). Edit here; no
# rebuild needed, just restart the recording service.

recording_settings:
  output_root: "/home/ubuntu/data"
  uuid: "6632b9d7-6156-4bbb-b024-0422ae306f9a"

  # ───────────────────────── Video (colour/IR streams) ─────────────────────
  # Encoder: libx265 (CPU), hevc_nvenc (Nvidia GPU), hevc_qsv (Intel),
  # hevc_amf (AMD).
  #
  # 2026-10-01: NVENC could not initialise (host driver/library mismatch,
  # NVML 580.178) and every video came out at 0 bytes because there was no
  # fallback. The recorder now probes the encoder before recording and falls
  # back to libx264/libx265 when it cannot initialise; leave
  # video_software_fallback: true unless CPU headroom is the binding problem.
  video_encoder: "hevc_nvenc"

  # Probe the encoder at rig start and at every recording start (the same
  # 0.1 s encode as the operator pre-flight). A failure is logged as an ERROR
  # on the recording console instead of failing silently at capture time.
  video_encoder_probe: true
  # Fall back to the software encoder (h264_nvenc -> libx264,
  # hevc_nvenc -> libx265) when the requested encoder will not initialise.
  video_software_fallback: true

  # H.265 CRF, 0-51. Lower = better quality / larger files.
  #   18 visually lossless · 22 high · 28 good · 35 low
  video_crf: 18

  # Frame rate written to the .mp4 container; match the sensor rate.
  video_fps: 30.0

  # Seconds to wait after /start_recording before treating a missing or
  # 0-byte .mp4 as a failure and printing it on the recording console.
  # (Recorders hold the first 2-5 s of frames back to measure the real fps.)
  video_startup_grace_s: 20

  # ───────────────────────── Rosbag (depth/metadata) ───────────────────────
  # Storage format: mcap (recommended) or sqlite3.
  bag_storage: "mcap"

  # Split the bag: with limits set, rosbag2 closes a finalised bag_N.mcap
  # (footer + own index) every N seconds / MiB instead of writing one
  # unbounded bag_0.mcap. On 2026-10-01 a single 9.19 GB mcap lost the whole
  # 72-minute session to one crash; splitting caps that loss at one split.
  # 0 disables a limit. Splitting works with every storage/compression mode.
  bag_max_duration_s: 300      # 5 minutes per split
  bag_max_size_mb: 1024        # or 1 GiB, whichever comes first

  # Watchdog: poll the recorder children for the whole session (they used to
  # be checked once, 0.2 s after launch). A dead bag recorder is restarted
  # into a fresh bag_N/ directory; every event is logged and mirrored to
  # <session>/watchdog.log and <session>/recorder_heartbeat.json.
  watchdog:
    enabled: true
    interval_s: 5
    restart_bag: true
    restart_throttle: true

  # Seconds a graceful stop lets the recorders drain before SIGKILL. This is
  # the path that writes the MCAP footer, metadata.yaml and session_report.yaml.
  # Keep it below docker-compose's stop_grace_period (60s).
  stop_grace_s: 30

  # Bag compression. Options:
  #   none    - off
  #   storage - mcap chunk-level zstd via --storage-preset-profile (RECOMMENDED
  #             for mcap: better ratio than message mode, index stays usable)
  #   message - rosbag2 per-message zstd (legacy; works with any storage)
  #   file    - outer zstd wrapper; whole file must be decompressed to read
  bag_compression: "storage"

  # Only used when bag_compression is "storage".
  #   zstd_fast  - fast zstd, moderate ratio (safe default)
  #   zstd_small - 4MB chunks + slowest zstd, best ratio, highest CPU.
  #                Try this if disk throughput/size is the bottleneck; watch
  #                the recorder for dropped messages.
  mcap_preset: "zstd_fast"

  # In-memory cache per bag recorder (MB). Buffers against disk latency
  # spikes; raise for slow drives, lower if RAM is tight. (Kinect manager)
  bag_cache_size_mb: 128

  # ───────────────────────── Kinect per-stream settings ────────────────────
  # Applied to every Kinect v2 camera with record: true.
  #   enabled    : record this stream
  #   resolution : color → qhd(960×540) | hd(1920×1080) | sd(512×424)
  #                depth → sd | qhd | hd   (ir is always sd, 512×424)
  #   rectified  : true records the bridge's undistorted (_rect) product;
  #                false records the raw sensor stream. NOTE the sensor only
  #                measures depth/IR at sd — qhd/hd depth is that same data
  #                registered into the colour frame and upsampled, so it is
  #                always rectified. Raw sd + camera_info + the calibration
  #                snapshot preserve the ability to rectify/register offline
  #                (and to re-do it better after a future calibration);
  #                rectified data bakes today's calibration in forever.
  #                Colour goes to H.265 video where the transform is baked in
  #                regardless, so it stays rectified for direct use.
  #   mode       : "raw" subscribes to the uncompressed topic and re-encodes
  #                (color → H.265 video, depth/ir → raw 16-bit in bag).
  #                "compressed" uses the bridge's built-in compression
  #                (color → JPEG passthrough to video, depth/ir → PNG in bag).
  #   fps        : color → target video frame rate.
  #                depth/ir → bag rate; values below the native 30 insert a
  #                zero-copy throttle relay (topic_throttle) and record
  #                <topic>/throttled instead. IR is mainly for calibration
  #                and QA, so 5 Hz saves ~85% of its disk cost.
  # snapshot_calibration : copy each recorded camera's bridge calibration
  #                files (intrinsics + depth<->colour extrinsic) into
  #                <session>/calibration/<serial>/ at capture start.
  # calibration_dir      : where those per-serial dirs live
  #                (default $BASE_WS/src/kinect2_ros2/kinect2_bridge/data).
  kinect:
    snapshot_calibration: true
    # calibration_dir: "/home/ubuntu/base_ws/src/kinect2_ros2/kinect2_bridge/data"
    streams:
      color:
        enabled: true
        resolution: "qhd"
        rectified: true
        mode: "compressed"
        fps: 30
      depth:
        enabled: true
        resolution: "sd"
        rectified: false
        mode: "raw"
        fps: 30
      ir:
        enabled: true
        rectified: false
        mode: "raw"
        fps: 5

  # ───────────────────────── RealSense per-stream settings ─────────────────
  # Applied to every RealSense camera with record: true.
  #   enabled : record this stream
  #   mode    : color → "compressed" subscribes to the camera's JPEG topic
  #             (low bandwidth, lossy on top of camera compression); "raw"
  #             subscribes to the uncompressed topic and re-encodes locally.
  #             depth → "compressed" records image_transport's compressedDepth
  #             (PNG, usb driver only — the PoE firmware publishes no
  #             compressed depth); "raw" records uncompressed 16-bit frames
  #             (~55 MB/s per camera at 30 fps — avoid for long sessions).
  #   fps     : color/IR → video recorder subsamples on ROS timestamps.
  #             depth → bag rate; below-native values insert a zero-copy
  #             throttle relay and record <topic>/throttled instead.
  realsense:
    color:
      enabled: true
      # raw ~46 MB/s vs compressed ~5 MB/s per camera over the network
      mode: "compressed"
      fps: 15
    infrared_1:
      enabled: false
      mode: "raw"
      fps: 5
    infrared_2:
      enabled: false
      mode: "raw"
      fps: 5
    depth:
      enabled: true
      mode: "raw"
      fps: 15

  # ───────────────────────── Vicon ────────────────────────────────────────
  vicon:
    # Whether to record Vicon topics (segments, labeled markers, unlabeled
    # markers). All topics matching topic_regex are added to the bag,
    # except those matching exclude_regex. The *_visualization MarkerArray
    # topics duplicate the PointStamped data (~1.5 GB per 3 h session) and
    # can be regenerated offline, so they are excluded by default.
    enabled: true
    topic_regex: "/vicon/.*"
    exclude_regex: "/vicon/.*visualization.*"
    # Nominal Vicon publish rate; used by session_check and the health
    # monitor to flag under-delivering topics.
    expected_hz: 120

    # ── Nexus UDP capture trigger ───
    # When enabled, /start_recording and /stop_recording also send UDP
    # capture commands to Vicon Nexus (Auto Capture Setup must be armed).
    nexus_capture: true
    # Nexus machine IP and UDP port (set in Nexus → Auto Capture Setup)
    nexus_host: "192.168.10.1"
    nexus_port: 3030
    # Database path on the Nexus PC where captures are stored
    nexus_path: ""

  # ───────────────────────── Velodyne ─────────────────────────────────────
  velodyne:
    # Recorded for every unit in velodyne.yaml with record: true.
    # Names are relative to each unit's namespace (/<unit>/<topic>).
    # expected_hz: nominal spin rate, used by session_check / monitor.
    expected_hz: 10
    topics:
      - "velodyne_points"     # decoded PointCloud2 — ready to use, large
      # - "velodyne_packets"  # raw UDP packets — ~4x smaller, lossless, but
      #                       # needs replay through velodyne_pointcloud to
      #                       # reconstruct clouds. Enable to save disk;
      #                       # you may then disable velodyne_points.

  # ──────────────────────── Extra bag topics ──────────────────────────────
  # Any arbitrary topics to record in the bag, e.g. app events, debug
  # channels, etc. Use exact topic names.
  bag_extra_topics:
    - "/sharp/events"

  # ───────────────────────── Session sanity check ─────────────────────────
  # After /stop_recording, session_check compares the recorded bag + videos
  # against the expected_topics.yaml manifest written at capture start and
  # writes <session>/session_report.yaml. A missing sensor or a stream
  # running below min_rate_factor × its expected rate fails the check, and
  # the failure is reported in the /stop_recording response.
  session_check:
    enabled: true
    # A stream fails when its recorded rate < expected_hz × this factor.
    min_rate_factor: 0.5

  # ───────────────────────── Topic health monitor ──────────────────────────
  # Live web dashboard (topic_health_monitor node) showing per-topic Hz for
  # every topic the rig is configured to record, plus disk headroom and
  # session growth. Subscriptions are raw serialized bytes (never
  # deserialized), so CPU overhead is negligible.
  monitor:
    enabled: true
    host: "0.0.0.0"
    port: 8765
    # Sliding window (seconds) for the Hz estimate.
    window_seconds: 5.0
    # A topic turns amber below min_rate_factor × expected Hz (red when
    # silent). Uses the same expected rates as session_check.
    min_rate_factor: 0.5
